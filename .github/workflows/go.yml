name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format check
        run: test -z "$(gofmt -l daemon)"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build host binary
        run: go build -trimpath -o /tmp/android-sec-mcp-host ./daemon

      - name: Build Android arm64 binary
        run: GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /tmp/android-sec-mcp-android-arm64 ./daemon
